# Cada servicio es un contenedor aparte, con su propio sistema de archivos y su
# proceso. Se comunican por la red interna de Docker llamándose por NOMBRE de
# servicio (db, ml-service-1, ...), no por IP: eso lo resuelve el DNS de Docker.
services:
  db:
    image: postgres:16
    container_name: stay-direct-db
    environment:
      POSTGRES_USER: stay
      POSTGRES_PASSWORD: stay_dev_password
      POSTGRES_DB: stay_direct
    ports:
      # host:contenedor — 5434 en el host para no chocar con el Postgres nativo
      # (5432) ni con otros contenedores; adentro Postgres sigue en 5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stay -d stay_direct"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dos réplicas del servicio de precios: el backend reparte el cálculo entre
  # ellas y sigue funcionando si una se cae. Misma imagen, contenedores distintos.
  ml-service-1:
    build: ./MLService
    container_name: stay-direct-ml-1
    ports:
      # Publicado SOLO en 127.0.0.1, no en 0.0.0.0: alcanzable desde esta máquina
      # para desarrollar con el backend fuera de Docker, pero invisible para el
      # resto de la red. El backend contenedorizado no usa este puerto: le habla
      # por la red interna con el nombre del servicio.
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  ml-service-2:
    build: ./MLService
    container_name: stay-direct-ml-2
    ports:
      # 8002 en el host para no chocar con la réplica 1; adentro sigue en 8001.
      - "127.0.0.1:8002:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build: ./Backend
    container_name: stay-direct-backend
    ports:
      - "8000:8000"
    # Los secretos (JWT_SECRET, ADMIN_*) se reutilizan del .env del backend.
    env_file:
      - ./Backend/.env
    # 'environment' pisa lo que venga del env_file: dentro de Docker la base y el
    # servicio de ML no están en localhost, sino en sus nombres de servicio.
    environment:
      DATABASE_URL: postgresql+psycopg://stay:stay_dev_password@db:5432/stay_direct
      ML_SERVICE_URLS: http://ml-service-1:8001,http://ml-service-2:8001
      ML_TIMEOUT_SECONDS: "2.0"
      ML_FAILURE_THRESHOLD: "3"
      ML_RECOVERY_SECONDS: "30.0"
    depends_on:
      db:
        # Espera a que Postgres acepte conexiones, no solo a que el contenedor
        # exista: si no, el backend arranca antes y truena al crear las tablas.
        condition: service_healthy
      # Las réplicas del ML no son condition: service_healthy a propósito. El
      # backend debe poder arrancar aunque el ML no esté listo: para eso existe
      # la estimación de respaldo.
      ml-service-1:
        condition: service_started
      ml-service-2:
        condition: service_started

volumes:
  pgdata:
